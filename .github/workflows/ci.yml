name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hj
          POSTGRES_PASSWORD: hj
          POSTGRES_DB: hellojobs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hj" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hj:hj@localhost:5432/hellojobs_test
      E2E_DATABASE_URL: postgres://hj:hj@localhost:5432/hj_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and lint
        run: npm run lint
      - name: Build
        # The contact details are baked into the build. One is set with the current name and one with the older
        # VITE_ name, so the smoke test below proves both reach the page.
        env:
          NEXT_PUBLIC_GRIEVANCE_EMAIL: grievance@ci.example
          VITE_HELPLINE: 1800-000-0000
        run: npm run build
      - name: Production smoke test
        # Starts the production build with the strict page policy and checks headers, nonces, public pages
        # and that visitors never see HR contacts. Runs before the dev-server e2e so nothing touches .next.
        run: |
          NODE_ENV=production PORT=3200 DATABASE_URL="$TEST_DATABASE_URL" APP_URL=http://localhost:3200 \
            SESSION_SECRET=ci-smoke-secret-ci-smoke-secret-ci-smoke-secret npx next start -p 3200 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3200/api/health >/dev/null 2>&1 && break; sleep 1; done
          EXPECT_CONTACT=grievance@ci.example,1800-000-0000 node scripts/preview-check.mjs http://localhost:3200
          kill %1
      - name: API and security tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end journey
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
