name: Generate initial migration (one-off)

# Runs when the branch `ci/gen-migration` is pushed. Creates
# prisma/migrations/<timestamp>_init from prisma/schema.prisma, proves it
# applies to a real PostgreSQL, and commits it to the branch it ran on.
# Delete this workflow once migrations are committed.

on:
  push:
    branches: [ci/gen-migration]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hello_jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hello_jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate migration SQL from the schema
        run: |
          if [ -d prisma/migrations ] && [ -n "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            echo "::error::prisma/migrations already exists; refusing to overwrite."
            exit 1
          fi
          DIR="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_init"
          mkdir -p "$DIR"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$DIR/migration.sql"
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          echo "Generated $DIR ($(wc -l < "$DIR/migration.sql") lines)"

      - name: Prove it applies to a real database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Prove it matches the schema exactly (no drift)
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Commit migration back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Add initial Prisma migration (generated in CI against PostgreSQL 16)"
          git push
