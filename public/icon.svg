<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shramkart logo</title>
  <desc id="desc">A circular industrial worker emblem with yellow workers and blue gear ring, followed by the Shramkart wordmark.</desc>

  <defs>
    <style>
      .gear { fill: #7ac5dd; stroke: #1d1d1d; stroke-width: 10; stroke-linejoin: round; }
      .dark { fill: #171717; }
      .yellow { fill: #f7d500; stroke: #1d1d1d; stroke-width: 10; }
      .light { fill: #f2f2f2; stroke: #1d1d1d; stroke-width: 10; }
      .helmet { fill: #f2f2f2; stroke: #1d1d1d; stroke-width: 10; }
      .tool { fill: #7ac5dd; stroke: #1d1d1d; stroke-width: 8; stroke-linecap: round; }
      .word { font-family: Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="512" height="512" fill="#efefef"/>

  <g transform="translate(256 170)">
    <!-- gear outer ring -->
    <g>
      <path class="gear" d="M-118 -12 L-188 -58 L-198 -28 L-140 6 L-140 62 L-200 88 L-188 118 L-118 74 L-78 112 L-56 82 L-98 48 L-98 -48 L-56 -82 L-78 -112 Z"/>
      <path class="gear" d="M118 -12 L188 -58 L198 -28 L140 6 L140 62 L200 88 L188 118 L118 74 L78 112 L56 82 L98 48 L98 -48 L56 -82 L78 -112 Z"/>
      <path class="gear" d="M-12 -118 L-58 -188 L-28 -198 L6 -140 L62 -140 L88 -200 L118 -188 L74 -118 L112 -78 L82 -56 L48 -98 L-48 -98 L-82 -56 L-112 -78 Z"/>
      <path class="gear" d="M-12 118 L-58 188 L-28 198 L6 140 L62 140 L88 200 L118 188 L74 118 L112 78 L82 56 L48 98 L-48 98 L-82 56 L-112 78 Z"/>
      <circle r="120" class="gear"/>
    </g>

    <!-- black circle center -->
    <circle r="90" class="dark"/>

    <!-- left worker -->
    <g transform="translate(-110,10)">
      <rect x="-18" y="-50" width="36" height="42" rx="8" class="yellow"/>
      <circle cx="0" cy="-74" r="26" class="helmet"/>
      <path d="M-24 -90 L24 -90 L36 -70 L-36 -70 Z" class="yellow"/>
      <rect x="-14" y="-18" width="28" height="76" rx="8" class="yellow"/>
      <rect x="-42" y="18" width="16" height="58" rx="8" class="yellow"/>
      <rect x="26" y="18" width="16" height="58" rx="8" class="yellow"/>
      <path class="tool" d="M-40 98 L-62 136"/>
      <path class="tool" d="M40 98 L62 136"/>
      <path class="tool" d="M-38 24 L-82 66"/>
      <path class="tool" d="M38 24 L82 66"/>
      <path d="M-82 66 L-98 74" class="dark"/>
      <path d="M82 66 L98 74" class="dark"/>
      <path d="M-95 75 L-73 69 L-80 47 L-102 55 Z" class="tool"/>
    </g>

    <!-- center worker -->
    <g transform="translate(0,0)">
      <rect x="-24" y="-70" width="48" height="55" rx="10" class="yellow"/>
      <circle cx="0" cy="-100" r="32" class="helmet"/>
      <path d="M-30 -118 L30 -118 L40 -92 L-40 -92 Z" class="yellow"/>
      <rect x="-18" y="-18" width="36" height="90" rx="10" class="yellow"/>
      <rect x="-54" y="18" width="20" height="62" rx="10" class="yellow"/>
      <rect x="34" y="18" width="20" height="62" rx="10" class="yellow"/>
      <path class="tool" d="M-52 108 L-80 150"/>
      <path class="tool" d="M52 108 L80 150"/>
      <path class="tool" d="M-54 42 L-104 92"/>
      <path class="tool" d="M54 42 L104 92"/>
      <path d="M-104 92 L-118 96" class="dark"/>
      <path d="M104 92 L118 96" class="dark"/>
      <path d="M-120 96 L-92 90 L-103 66 L-132 75 Z" class="tool"/>
      <path d="M120 96 L92 90 L103 66 L132 75 Z" class="tool"/>
    </g>

    <!-- right worker -->
    <g transform="translate(110,10)">
      <rect x="-18" y="-50" width="36" height="42" rx="8" class="yellow"/>
      <circle cx="0" cy="-74" r="26" class="helmet"/>
      <path d="M-24 -90 L24 -90 L36 -70 L-36 -70 Z" class="yellow"/>
      <rect x="-14" y="-18" width="28" height="76" rx="8" class="yellow"/>
      <rect x="-42" y="18" width="16" height="58" rx="8" class="yellow"/>
      <rect x="26" y="18" width="16" height="58" rx="8" class="yellow"/>
      <path class="tool" d="M-40 98 L-62 136"/>
      <path class="tool" d="M40 98 L62 136"/>
      <path class="tool" d="M-38 24 L-82 66"/>
      <path class="tool" d="M38 24 L82 66"/>
      <path d="M-82 66 L-98 74" class="dark"/>
      <path d="M82 66 L98 74" class="dark"/>
      <path d="M95 75 L73 69 L80 47 L102 55 Z" class="tool"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(256 430)">
    <text x="0" y="0" text-anchor="middle" class="word" font-size="62">
      <tspan fill="#1d1d1d">SHRAM</tspan><tspan fill="#ea5a5a">KART</tspan>
    </text>
  </g>
</svg>
