name: CI

on:
  push:
    branches: [main, "feat/**", "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `bash scripts/ci-run.sh "<name>" <cmd>` runs a command and, on failure, also
# writes the tail of its output as an annotation so it shows on the checks page.

jobs:
  check:
    name: Lint, types, migrations, unit + integration tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hello_jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hello_jobs_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hello_jobs_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-run.sh "prisma validate" npx prisma validate
      - run: bash scripts/ci-run.sh "lint" npm run lint
      - run: bash scripts/ci-run.sh "typecheck" npm run typecheck
      - run: bash scripts/ci-run.sh "unit tests" npm test

      # Migrations are the source of truth for every environment.
      - name: Apply committed migrations to a fresh database
        run: bash scripts/ci-run.sh "migrate deploy" npx prisma migrate deploy
      - name: Fail if schema.prisma has changes without a migration
        run: |
          bash scripts/ci-run.sh "migration drift check" npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Integration tests (server actions against real PostgreSQL)
        run: bash scripts/ci-run.sh "integration tests" npm run test:integration

      - run: bash scripts/ci-run.sh "build" npm run build

  e2e:
    name: End-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hello_jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hello_jobs
      SESSION_SECRET: ci-session-secret-ci-session-secret-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-run.sh "migrate deploy" npx prisma migrate deploy
      - run: bash scripts/ci-run.sh "seed" npm run db:seed
      - run: bash scripts/ci-run.sh "playwright" npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
